<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audrix API Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .demo-container {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      overflow: hidden;
      padding: 2rem;
    }
    h1 { margin-top: 0; }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    button, select, input[type="color"] {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .visualizer-box {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
    }
    audio {
      width: 100%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <h1>Audrix API Embed Demo</h1>
    <p>This demonstrates a third-party website embedding the Audrix visualizer and connecting it to their own audio player.</p>

    <div class="controls">
      <div>
        <label>Visual Style:</label>
        <select id="mode-select">
          <option value="line-spectrum">Line Spectrum</option>
          <option value="particle-galaxy">Particle Galaxy</option>
          <option value="neon-rings">Neon Rings</option>
          <option value="cyber-grid">Cyber Grid</option>
          <option value="mobius-ribbon">Möbius Ribbon</option>
        </select>
      </div>
      <div>
        <label>BG Color:</label>
        <input type="color" id="bg-color" value="#050510">
      </div>
      <div>
        <label>Style Color:</label>
        <input type="color" id="style-color" value="#FF1F5A">
      </div>
    </div>

    <!-- The container where the visualizer will be rendered -->
    <div id="audrix-container" class="visualizer-box"></div>

    <!-- The host's audio element -->
    <audio id="my-audio" controls crossorigin="anonymous">
      <source src="public/sample.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <!-- Include the Audrix Embed Script and styles -->
  <!-- Note: This expects you to run 'npm run build:api' first -->
  <link rel="stylesheet" href="dist-api/audrix-api.css">
  <script src="dist-api/audrix-api.umd.cjs"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Audrix
      const visualizer = new window.AudrixVisualizer({
        container: document.getElementById('audrix-container'),
        audioElement: document.getElementById('my-audio'),
        mode: 'line-spectrum',
        backgroundColor: document.getElementById('bg-color').value,
        colorPreset: document.getElementById('style-color').value
      });

      // 2. Wire up custom controls to demonstrate the API
      document.getElementById('mode-select').addEventListener('change', (e) => {
        visualizer.setMode(e.target.value);
      });

      document.getElementById('bg-color').addEventListener('input', (e) => {
        visualizer.setBackgroundColor(e.target.value);
      });

      document.getElementById('style-color').addEventListener('input', (e) => {
        visualizer.setColorPreset(e.target.value);
      });
    });
  </script>
</body>
</html>
